[project]
name = "mmm"
version = "0.1.0"
description = "Marketing Mix Model bayesiano con PyMC-Marketing y simulador de presupuesto"
readme = "README.md"
license = "MIT"
authors = [{ name = "Marcos Hoyos" }]
requires-python = ">=3.12"
dependencies = [
    "pymc-marketing==1.3.0",
    "nutpie",
    "holidays",
    "pandas",
    "matplotlib",
]

[project.scripts]
mmm = "mmm.cli:main"

[dependency-groups]
dev = ["pytest", "ruff", "nbconvert", "ipykernel"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mmm"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["slow: entrena un modelo chico (tarda minutos)"]
