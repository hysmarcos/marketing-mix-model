<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="1200" height="400" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif"><rect width="1200" height="400" rx="16" fill="#fcfcfb" stroke="#e1e0d9"/><text x="60" y="78" font-size="15" letter-spacing="2" fill="#898781">MARKETING MIX MODEL · PYMC-MARKETING · MERIDIAN</text><text x="60" y="142" font-size="46" font-weight="700" fill="#0b0b0b">Where does each ad dollar pay off?</text><rect x="60" y="214" width="40" height="4" rx="2" fill="#2a78d6"/><text x="60" y="282" font-size="56" font-weight="700" fill="#0b0b0b">+35%</text><text x="60" y="318" font-size="17" fill="#52514e"><tspan x="60" dy="0">more media-driven sales</tspan><tspan x="60" dy="22">on the same budget</tspan></text><rect x="330" y="214" width="40" height="4" rx="2" fill="#2a78d6"/><text x="330" y="282" font-size="56" font-weight="700" fill="#0b0b0b">96%</text><text x="330" y="318" font-size="17" fill="#52514e"><tspan x="330" dy="0">probability the new</tspan><tspan x="330" dy="22">split does better</tspan></text><rect x="600" y="214" width="40" height="4" rx="2" fill="#2a78d6"/><text x="600" y="282" font-size="56" font-weight="700" fill="#0b0b0b">2.9%</text><text x="600" y="318" font-size="17" fill="#52514e"><tspan x="600" dy="0">error on 12 weeks the</tspan><tspan x="600" dy="22">model never saw</tspan></text><rect x="870" y="214" width="40" height="4" rx="2" fill="#2a78d6"/><text x="870" y="282" font-size="56" font-weight="700" fill="#0b0b0b">49/50</text><text x="870" y="318" font-size="17" fill="#52514e"><tspan x="870" dy="0">known effects recovered</tspan><tspan x="870" dy="22">in the test</tspan></text></svg>