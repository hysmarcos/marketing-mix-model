<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="1200" height="400" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif"><rect width="1200" height="400" rx="16" fill="#1a1a19" stroke="#2c2c2a"/><text x="60" y="78" font-size="15" letter-spacing="2" fill="#898781">MARKETING MIX MODEL · PYMC-MARKETING · MERIDIAN</text><text x="60" y="142" font-size="46" font-weight="700" fill="#f0efec">¿Dónde rinde cada peso de publicidad?</text><rect x="60" y="214" width="40" height="4" rx="2" fill="#3987e5"/><text x="60" y="282" font-size="56" font-weight="700" fill="#f0efec">+35%</text><text x="60" y="318" font-size="17" fill="#c3c2b7"><tspan x="60" dy="0">más ventas de medios con</tspan><tspan x="60" dy="22">el mismo presupuesto</tspan></text><rect x="330" y="214" width="40" height="4" rx="2" fill="#3987e5"/><text x="330" y="282" font-size="56" font-weight="700" fill="#f0efec">96%</text><text x="330" y="318" font-size="17" fill="#c3c2b7"><tspan x="330" dy="0">probabilidad de que el</tspan><tspan x="330" dy="22">nuevo reparto mejore</tspan></text><rect x="600" y="214" width="40" height="4" rx="2" fill="#3987e5"/><text x="600" y="282" font-size="56" font-weight="700" fill="#f0efec">2,9%</text><text x="600" y="318" font-size="17" fill="#c3c2b7"><tspan x="600" dy="0">error en 12 semanas que</tspan><tspan x="600" dy="22">el modelo no vio</tspan></text><rect x="870" y="214" width="40" height="4" rx="2" fill="#3987e5"/><text x="870" y="282" font-size="56" font-weight="700" fill="#f0efec">49/50</text><text x="870" y="318" font-size="17" fill="#c3c2b7"><tspan x="870" dy="0">efectos conocidos</tspan><tspan x="870" dy="22">recuperados en la prueba</tspan></text></svg>