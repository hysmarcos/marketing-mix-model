name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      MPLBACKEND: Agg
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Instalar dependencias
        run: uv sync
      - name: Estilo de código (ruff)
        run: uv run ruff check . && uv run ruff format --check src tests
      - name: Tests de Python (incluye el modelo de prueba)
        run: uv run pytest -v
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Tests de JavaScript (paridad con Python)
        run: node --test "site/js/*.test.js"

  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: test
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
